<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%">
  <defs>
    <linearGradient id="logoShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#logoShieldGrad)" stroke="#DCA542" stroke-width="2" />
    <g transform="translate(40,40)">
      <!-- 8 Rays -->
      <path d="M0 -30 L3.5 -18 L-3.5 -18 Z" fill="#F0BC5E" />
      <path d="M0 30 L3.5 18 L-3.5 18 Z" fill="#F0BC5E" />
      <path d="M-30 0 L-18 3.5 L-18 -3.5 Z" fill="#F0BC5E" />
      <path d="M30 0 L18 3.5 L18 -3.5 Z" fill="#F0BC5E" />
      <path d="M-22 -22 L-13 -10 L-10 -13 Z" fill="#D97706" />
      <path d="M22 22 L13 10 L10 13 Z" fill="#D97706" />
      <path d="M-22 22 L-10 13 L-13 10 Z" fill="#D97706" />
      <path d="M22 -22 L10 -13 L13 -10 Z" fill="#D97706" />
      <!-- Eye Curve -->
      <path d="M -24 0 C -14 -14, 14 -14, 24 0 C 14 14, -14 14, -24 0 Z" fill="none" stroke="#F0BC5E" stroke-width="2.5" stroke-linecap="round" />
      <!-- Core -->
      <circle cx="0" cy="0" r="10" fill="#0A0F1D" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="5" fill="#F0BC5E" />
      <circle cx="0" cy="0" r="2" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography -->
  <text x="100" y="42" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">SHUBH <tspan fill="#F0BC5E">SOLAR</tspan></text>
  <text x="102" y="66" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="1.8">ENERGY &amp; THIRD EYE EPC • JABALPUR</text>
</svg>
